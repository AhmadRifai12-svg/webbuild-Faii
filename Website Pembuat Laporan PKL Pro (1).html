<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pembuat Laporan PKL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 for Interactive Animations & Modals -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; padding: 2cm; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- GLOBAL FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 font-medium">
        Copyright By Ahmad Rifa'i &copy; 2026 - Sistem Pembuat Laporan PKL Profesional
    </footer>

    <script>
        // --- DATABASE & STATE MANAGEMENT (LOCALSTORAGE) ---
        const DB_KEY = 'pkl_master_database_v7';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            users: [],
            currentUser: null,
            settings: { price: 80000 },
            subscriptions: [], // { username, identityKey, status, date }
            reports: {}
        };

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // SweetAlert2 Toast Helper for Smooth Animations
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2500,
            timerProgressBar: true
        });

        function showToast(icon, title) {
            Toast.fire({ icon, title });
        }

        // --- ROUTER & RENDER ENGINE ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!db.currentUser) {
                renderAuthPage(app);
            } else if (db.currentUser === 'Admin') {
                renderAdminDashboard(app);
            } else {
                renderUserDashboard(app);
            }
        }

        // --- AUTHENTICATION PAGES ---
        let authMode = 'login'; // 'login' or 'register'

        function renderAuthPage(container) {
            container.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 fade-in flex flex-col justify-between">
                        <div>
                            <div class="text-center mb-6">
                                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg shadow-blue-600/30 mb-3 text-2xl font-bold">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-slate-900">Portal Laporan PKL</h1>
                                <p class="text-xs text-slate-500 mt-1">Sistem Pembuatan & Pengelolaan Dokumen Resmi</p>
                            </div>

                            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                                <button onclick="authMode='login'; render();" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all ${authMode==='login'?'bg-white text-slate-900 shadow-sm':'text-slate-500'}">Masuk</button>
                                <button onclick="authMode='register'; render();" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all ${authMode==='register'?'bg-white text-slate-900 shadow-sm':'text-slate-500'}">Daftar</button>
                            </div>

                            ${authMode === 'login' ? `
                                <form onsubmit="handleLogin(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username</label>
                                        <input type="text" id="loginUser" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                                        <input type="password" id="loginPass" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                    </div>
                                    <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all text-sm">Masuk Sistem</button>
                                </form>
                            ` : `
                                <form onsubmit="handleRegister(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username Baru</label>
                                        <input type="text" id="regUser" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                                        <input type="password" id="regPass" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                    </div>
                                    <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-lg shadow-emerald-600/30 transition-all text-sm">Daftar Akun</button>
                                </form>
                            `}
                        </div>
                        <div class="text-center pt-6 mt-6 border-t border-slate-100 text-[11px] text-slate-400 font-medium">
                            Copyright By Ahmad Rifa'i
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            if (u === 'Admin' && p === 'faii1209') {
                db.currentUser = 'Admin';
                saveDB();
                showToast('success', 'Berhasil masuk sebagai Admin');
                render();
                return;
            }

            const found = db.users.find(x => x.username === u && x.password === p);
            if (found) {
                db.currentUser = u;
                saveDB();
                showToast('success', `Selamat datang, ${u}`);
                render();
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal Masuk', text: 'Username atau password salah!' });
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value.trim();

            if (u.toLowerCase() === 'admin') {
                Swal.fire({ icon: 'error', title: 'Kesalahan', text: 'Username Admin tidak dapat digunakan.' });
                return;
            }

            if (db.users.some(x => x.username === u)) {
                Swal.fire({ icon: 'warning', title: 'Peringatan', text: 'Username sudah terdaftar!' });
                return;
            }

            db.users.push({ username: u, password: p });
            saveDB();
            showToast('success', 'Akun berhasil didaftarkan!');
            authMode = 'login';
            render();
        }

        // --- ADMIN DASHBOARD ---
        function renderAdminDashboard(container) {
            const subs = db.subscriptions;
            container.innerHTML = `
                <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center font-bold">A</div>
                        <div>
                            <h2 class="font-bold text-slate-900">Panel Administrator</h2>
                            <p class="text-xs text-slate-500">Copyright By Ahmad Rifa'i</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 bg-rose-50 text-rose-600 rounded-xl text-sm font-semibold hover:bg-rose-100 transition-all"><i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Keluar</button>
                </nav>

                <div class="max-w-6xl w-full mx-auto p-6 space-y-6 flex-grow fade-in">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                        <h3 class="text-lg font-bold text-slate-900 mb-4"><i class="fa-solid fa-tags text-blue-600 mr-2"></i>Pengaturan Harga Paket Lisensi</h3>
                        <div class="flex items-center space-x-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Harga Per Identitas (Rp)</label>
                                <input type="number" id="adminPrice" value="${db.settings.price}" class="px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-600 text-sm w-60">
                            </div>
                            <button onclick="updatePrice()" class="mt-5 px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 shadow-md transition-all">Simpan Harga</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                        <h3 class="text-lg font-bold text-slate-900 mb-4"><i class="fa-solid fa-users text-blue-600 mr-2"></i>Daftar Pengguna Berlangganan</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                                    <tr>
                                        <th class="p-3 rounded-l-xl">Username</th>
                                        <th class="p-3">Kunci Identitas</th>
                                        <th class="p-3">Status</th>
                                        <th class="p-3">Tanggal</th>
                                        <th class="p-3 rounded-r-xl">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${subs.length === 0 ? `<tr><td colspan="5" class="text-center py-6 text-slate-400">Belum ada data langganan.</td></tr>` : 
                                        subs.map((s, idx) => `
                                            <tr>
                                                <td class="p-3 font-semibold text-slate-800">${s.username}</td>
                                                <td class="p-3 text-slate-600">${s.identityKey}</td>
                                                <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${s.status==='ACTIVE'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}">${s.status}</span></td>
                                                <td class="p-3 text-slate-500">${s.date}</td>
                                                <td class="p-3 space-x-2">
                                                    ${s.status === 'PENDING' ? `<button onclick="approveSub(${idx})" class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700">Setujui</button>` : ''}
                                                    <button onclick="deleteSub(${idx})" class="px-3 py-1 bg-rose-50 text-rose-600 rounded-lg text-xs font-semibold hover:bg-rose-100">Hapus</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function updatePrice() {
            const p = parseInt(document.getElementById('adminPrice').value);
            if (isNaN(p) || p <= 0) {
                showToast('error', 'Harga tidak valid!');
                return;
            }
            db.settings.price = p;
            saveDB();
            showToast('success', 'Harga berhasil diperbarui!');
            render();
        }

        function approveSub(idx) {
            db.subscriptions[idx].status = 'ACTIVE';
            saveDB();
            showToast('success', 'Langganan tervalidasi dan aktif!');
            render();
        }

        function deleteSub(idx) {
            Swal.fire({
                title: 'Hapus data?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Hapus'
            }).then(res => {
                if(res.isConfirmed) {
                    db.subscriptions.splice(idx, 1);
                    saveDB();
                    showToast('success', 'Data berhasil dihapus');
                    render();
                }
            });
        }

        // --- USER DASHBOARD ---
        let activeTab = 'profile';

        function getUserReport() {
            if (!db.reports[db.currentUser]) {
                db.reports[db.currentUser] = {
                    profile: { name: '', nisn: '', school: '', department: 'RPL', company: '', companyAddress: '' },
                    chapters: {
                        bab1: 'Pendahuluan laporan PKL...',
                        bab2: 'Gambaran umum perusahaan...',
                        bab3: 'Pelaksanaan kegiatan PKL...',
                        bab4: 'Hasil dan pembahasan...',
                        bab5: 'Kesimpulan dan saran...'
                    },
                    logbook: [],
                    maps: { lat: '-6.2088', lng: '106.8456', address: 'Jakarta' },
                    structure: { mode: 'manual', leader: '', supervisor: '', schoolLeader: '', teacher: '', img: '' }
                };
                saveDB();
            }
            return db.reports[db.currentUser];
        }

        function renderUserDashboard(container) {
            const rep = getUserReport();
            const identityKey = `${rep.profile.name}|${rep.profile.nisn}|${rep.profile.school}|${rep.profile.company}`.trim();
            const sub = db.subscriptions.find(s => s.username === db.currentUser && s.identityKey === identityKey && s.status === 'ACTIVE');
            const isLocked = identityKey !== '|||' && !sub;

            container.innerHTML = `
                <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold"><i class="fa-solid fa-book"></i></div>
                        <div>
                            <h2 class="font-bold text-slate-900">Dashboard PKL - ${db.currentUser}</h2>
                            <p class="text-xs text-slate-500">Copyright By Ahmad Rifa'i</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 bg-rose-50 text-rose-600 rounded-xl text-sm font-semibold hover:bg-rose-100 transition-all"><i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Keluar</button>
                </nav>

                <div class="max-w-6xl w-full mx-auto p-6 flex flex-col md:flex-row gap-6 flex-grow">
                    <div class="w-full md:w-64 space-y-2">
                        <button onclick="activeTab='profile'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='profile'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-user-pen w-5"></i><span>1. Profil & Identitas</span></button>
                        <button onclick="activeTab='chapters'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='chapters'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-file-lines w-5"></i><span>2. Isi Bab Laporan</span></button>
                        <button onclick="activeTab='logbook'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='logbook'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-calendar-days w-5"></i><span>3. Jurnal Aktivitas</span></button>
                        <button onclick="activeTab='attendance'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='attendance'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-clipboard-user w-5"></i><span>4. Rekap Absensi</span></button>
                        <button onclick="activeTab='maps'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='maps'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-map-location-dot w-5"></i><span>5. Peta Lokasi</span></button>
                        <button onclick="activeTab='structure'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='structure'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-sitemap w-5"></i><span>6. Struktur Jabatan</span></button>
                        <button onclick="activeTab='preview'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 transition-all ${activeTab==='preview'?'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30':'bg-white text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-print w-5"></i><span>7. Pratinjau & Cetak</span></button>
                        ${isLocked ? `<button onclick="activeTab='payment'; render();" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm flex items-center space-x-3 bg-amber-500 text-white shadow-lg animate-pulse"><i class="fa-solid fa-lock w-5"></i><span>Bayar Lisensi (Rp ${db.settings.price.toLocaleString()})</span></button>` : ''}
                    </div>

                    <div class="flex-grow bg-white rounded-2xl p-6 shadow-sm border border-slate-100 fade-in">
                        ${isLocked && activeTab !== 'payment' && activeTab !== 'profile' ? `
                            <div class="text-center py-12 space-y-4">
                                <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-lock"></i></div>
                                <h3 class="text-xl font-bold text-slate-900">Identitas Terkunci / Belum Berlangganan</h3>
                                <p class="text-sm text-slate-500 max-w-md mx-auto">Silakan lengkapi profil identitas Anda dan lakukan pembayaran lisensi sebesar Rp ${db.settings.price.toLocaleString()} untuk membuka akses penuh laporan ini.</p>
                                <button onclick="activeTab='payment'; render();" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-semibold text-sm shadow-lg hover:bg-blue-700 transition-all">Lakukan Pembayaran Sekarang</button>
                            </div>
                        ` : (
                            activeTab === 'profile' ? renderProfileTab(rep) :
                            activeTab === 'chapters' ? renderChaptersTab(rep) :
                            activeTab === 'logbook' ? renderLogbookTab(rep) :
                            activeTab === 'attendance' ? renderAttendanceTab(rep) :
                            activeTab === 'maps' ? renderMapsTab(rep) :
                            activeTab === 'structure' ? renderStructureTab(rep) :
                            activeTab === 'preview' ? renderPreviewTab(rep) :
                            renderPaymentTab(rep)
                        )}
                    </div>
                </div>
            `;
        }

        // --- TAB VIEWS ---
        function renderProfileTab(rep) {
            return `
                <h3 class="text-lg font-bold text-slate-900 mb-4">Profil & Identitas Laporan</h3>
                <form onsubmit="saveProfile(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nama Lengkap Siswa</label>
                            <input type="text" id="pName" value="${rep.profile.name}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">NISN</label>
                            <input type="text" id="pNisn" value="${rep.profile.nisn}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nama Sekolah</label>
                            <input type="text" id="pSchool" value="${rep.profile.school}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Jurusan</label>
                            <select id="pDept" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                                <option value="RPL" ${rep.profile.department==='RPL'?'selected':''}>Rekayasa Perangkat Lunak (RPL)</option>
                                <option value="TKJ" ${rep.profile.department==='TKJ'?'selected':''}>Teknik Komputer & Jaringan (TKJ)</option>
                                <option value="AK" ${rep.profile.department==='AK'?'selected':''}>Akuntansi / Perkantoran</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nama Tempat PKL / Instansi</label>
                            <input type="text" id="pCompany" value="${rep.profile.company}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Alamat Instansi</label>
                            <input type="text" id="pCompanyAddress" value="${rep.profile.companyAddress}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                    </div>
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold shadow-md hover:bg-blue-700 transition-all">Simpan Profil</button>
                </form>
            `;
        }

        function saveProfile(e) {
            e.preventDefault();
            const rep = getUserReport();
            rep.profile = {
                name: document.getElementById('pName').value.trim(),
                nisn: document.getElementById('pNisn').value.trim(),
                school: document.getElementById('pSchool').value.trim(),
                department: document.getElementById('pDept').value,
                company: document.getElementById('pCompany').value.trim(),
                companyAddress: document.getElementById('pCompanyAddress').value.trim()
            };
            saveDB();
            showToast('success', 'Profil berhasil disimpan!');
            render();
        }

        function renderChaptersTab(rep) {
            return `
                <h3 class="text-lg font-bold text-slate-900 mb-4">Pengeditan Isi Bab Laporan</h3>
                <div class="space-y-4">
                    ${Object.keys(rep.chapters).map((key, i) => `
                        <div class="border border-slate-200 rounded-xl p-4 space-y-2">
                            <label class="block font-bold text-slate-800 uppercase text-xs">Bab ${i+1}</label>
                            <textarea id="chap_${key}" rows="4" class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 outline-none">${rep.chapters[key]}</textarea>
                        </div>
                    `).join('')}
                    <button onclick="saveChapters()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold shadow-md hover:bg-blue-700 transition-all">Simpan Perubahan Bab</button>
                </div>
            `;
        }

        function saveChapters() {
            const rep = getUserReport();
            Object.keys(rep.chapters).forEach(key => {
                rep.chapters[key] = document.getElementById(`chap_${key}`).value;
            });
            saveDB();
            showToast('success', 'Bab laporan berhasil diperbarui!');
        }

        function renderLogbookTab(rep) {
            return `
                <h3 class="text-lg font-bold text-slate-900 mb-4">Jurnal Aktivitas Harian</h3>
                <form onsubmit="addLogbook(event)" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tanggal</label>
                            <input type="date" id="logDate" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Keterangan Aktivitas</label>
                            <input type="text" id="logDesc" placeholder="Contoh: Mengerjakan modul web..." required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none">
                        </div>
                    </div>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-md transition-all">Tambah Aktivitas</button>
                </form>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                            <tr><th class="p-3">Tanggal</th><th class="p-3">Aktivitas</th><th class="p-3">Aksi</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${rep.logbook.length === 0 ? `<tr><td colspan="3" class="text-center py-4 text-slate-400">Belum ada jurnal.</td></tr>` :
                                rep.logbook.map((l, idx) => `
                                    <tr>
                                        <td class="p-3 font-semibold">${l.date}</td>
                                        <td class="p-3">${l.desc}</td>
                                        <td class="p-3"><button onclick="deleteLog(${idx})" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-semibold transition-all">Hapus</button></td>
                                    </tr>
                                `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function addLogbook(e) {
            e.preventDefault();
            const rep = getUserReport();
            rep.logbook.push({
                date: document.getElementById('logDate').value,
                desc: document.getElementById('logDesc').value.trim()
            });
            saveDB();
            showToast('success', 'Aktivitas ditambahkan & Absensi diperbarui otomatis!');
            render();
        }

        function deleteLog(idx) {
            const rep = getUserReport();
            rep.logbook.splice(idx, 1);
            saveDB();
            showToast('success', 'Aktivitas dihapus');
            render();
        }

        function renderAttendanceTab(rep) {
            return `
                <h3 class="text-lg font-bold text-slate-900 mb-2">Rekap Absensi Otomatis</h3>
                <p class="text-xs text-slate-500 mb-4">Absensi terisi secara otomatis berdasarkan tanggal aktivitas jurnal harian dan terkunci (Read-Only).</p>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                            <tr><th class="p-3">No</th><th class="p-3">Tanggal</th><th class="p-3">Status Kehadiran</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${rep.logbook.length === 0 ? `<tr><td colspan="3" class="text-center py-4 text-slate-400">Belum ada data absensi.</td></tr>` :
                                rep.logbook.map((l, idx) => `
                                    <tr>
                                        <td class="p-3">${idx+1}</td>
                                        <td class="p-3 font-semibold">${l.date}</td>
                                        <td class="p-3"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">Hadir</span></td>
                                    </tr>
                                `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderMapsTab(rep) {
            return `
                <h3 class="text-lg font-bold text-slate-900 mb-4">Peta Lokasi Instansi PKL</h3>
                <form onsubmit="saveMaps(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Latitude</label>
                        <input type="text" id="mLat" value="${rep.maps.lat}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Longitude</label>
                        <input type="text" id="mLng" value="${rep.maps.lng}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Keterangan Lokasi</label>
                        <input type="text" id="mAddress" value="${rep.maps.address}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
                    </div>
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold shadow-md hover:bg-blue-700 transition-all">Simpan Lokasi</button>
                </form>
            `;
        }

        function saveMaps(e) {
            e.preventDefault();
            const rep = getUserReport();
            rep.maps = {
                lat: document.getElementById('mLat').value.trim(),
                lng: document.getElementById('mLng').value.trim(),
                address: document.getElementById('mAddress').value.trim()
            };
            saveDB();
            showToast('success', 'Lokasi peta disimpan!');
        }

        function renderStructureTab(rep) {
            return `
                <h3 class="text-lg font-bold text-slate-900 mb-4">Struktur Jabatan & Organisasi</h3>
                <form onsubmit="saveStructure(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Mode Pengisian</label>
                        <select id="sMode" onchange="render()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
                            <option value="manual" ${rep.structure.mode==='manual'?'selected':''}>Manual Berjenjang</option>
                            <option value="upload" ${rep.structure.mode==='upload'?'selected':''}>Unggah Gambar Bagan</option>
                        </select>
                    </div>
                    ${rep.structure.mode === 'manual' ? `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">Kepala Sekolah</label><input type="text" id="s1" value="${rep.structure.leader || ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">Pembimbing Sekolah</label><input type="text" id="s2" value="${rep.structure.supervisor || ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">Pimpinan Instansi</label><input type="text" id="s3" value="${rep.structure.schoolLeader || ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">Pembimbing Lapangan</label><input type="text" id="s4" value="${rep.structure.teacher || ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none"></div>
                        </div>
                    ` : `
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">URL / Link Gambar Bagan Struktur</label>
                            <input type="text" id="sImg" value="${rep.structure.img || ''}" placeholder="https://..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
                        </div>
                    `}
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold shadow-md hover:bg-blue-700 transition-all">Simpan Struktur</button>
                </form>
            `;
        }

        function saveStructure(e) {
            e.preventDefault();
            const rep = getUserReport();
            rep.structure.mode = document.getElementById('sMode').value;
            if(rep.structure.mode === 'manual') {
                rep.structure.leader = document.getElementById('s1').value.trim();
                rep.structure.supervisor = document.getElementById('s2').value.trim();
                rep.structure.schoolLeader = document.getElementById('s3').value.trim();
                rep.structure.teacher = document.getElementById('s4').value.trim();
            } else {
                rep.structure.img = document.getElementById('sImg').value.trim();
            }
            saveDB();
            showToast('success', 'Struktur organisasi disimpan!');
        }

        function renderPaymentTab(rep) {
            const identityKey = `${rep.profile.name}|${rep.profile.nisn}|${rep.profile.school}|${rep.profile.company}`.trim();
            const existingSub = db.subscriptions.find(s => s.username === db.currentUser && s.identityKey === identityKey);

            return `
                <h3 class="text-lg font-bold text-slate-900 mb-2">Pembayaran & Aktivasi Lisensi</h3>
                <p class="text-xs text-slate-500 mb-6">Biaya lisensi sebesar <strong>Rp ${db.settings.price.toLocaleString()}</strong> berlaku untuk 1 identitas laporan.</p>

                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4 mb-6">
                    <h4 class="font-bold text-slate-800">Instruksi Pembayaran Transfer Rekening Pribadi</h4>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-slate-400">BANK BCA</p>
                            <p class="text-lg font-bold text-slate-900">6097307859</p>
                            <p class="text-xs text-slate-600">a.n. Ahmad Rifa'i</p>
                        </div>
                        <button onclick="navigator.clipboard.writeText('6097307859'); showToast('success', 'Nomor rekening disalin!');" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg text-xs font-semibold transition-all">Salin Rekening</button>
                    </div>
                </div>

                ${existingSub ? `
                    <div class="p-4 rounded-xl ${existingSub.status==='ACTIVE'?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'} font-semibold text-sm">
                        Status Pembayaran Anda saat ini: ${existingSub.status}
                    </div>
                ` : `
                    <button onclick="submitPayment()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold text-sm shadow-lg transition-all">Konfirmasi Telah Transfer</button>
                `}
            `;
        }

        function submitPayment() {
            const rep = getUserReport();
            const identityKey = `${rep.profile.name}|${rep.profile.nisn}|${rep.profile.school}|${rep.profile.company}`.trim();
            
            db.subscriptions.push({
                username: db.currentUser,
                identityKey: identityKey,
                status: 'PENDING',
                date: new Date().toLocaleDateString()
            });
            saveDB();
            showToast('success', 'Konfirmasi terkirim! Menunggu persetujuan Admin.');
            render();
        }

        function renderPreviewTab(rep) {
            return `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-slate-900">Pratinjau Dokumen Laporan</h3>
                    <button onclick="window.print()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-md transition-all"><i class="fa-solid fa-print mr-2"></i>Cetak / PDF</button>
                </div>
                <div id="print-section" class="bg-white p-8 rounded-xl border border-slate-200 space-y-6 text-sm leading-relaxed">
                    <div class="text-center space-y-2 border-b pb-6">
                        <h1 class="text-xl font-bold uppercase">Laporan Praktik Kerja Lapangan (PKL)</h1>
                        <h2 class="text-lg font-semibold">${rep.profile.company || '[Tempat PKL]'}</h2>
                        <p class="text-slate-600">Disusun oleh: ${rep.profile.name || '[Nama]'} (${rep.profile.nisn || '[NISN]'})</p>
                        <p class="text-slate-600">${rep.profile.school || '[Sekolah]'}</p>
                    </div>
                    <div class="space-y-4">
                        <h3 class="font-bold uppercase">Bab 1: Pendahuluan</h3>
                        <p>${rep.chapters.bab1}</p>
                        <h3 class="font-bold uppercase">Bab 2: Gambaran Umum</h3>
                        <p>${rep.chapters.bab2}</p>
                        <h3 class="font-bold uppercase">Bab 3: Pelaksanaan Kegiatan</h3>
                        <p>${rep.chapters.bab3}</p>
                        <h3 class="font-bold uppercase">Bab 4: Hasil & Pembahasan</h3>
                        <p>${rep.chapters.bab4}</p>
                        <h3 class="font-bold uppercase">Bab 5: Kesimpulan</h3>
                        <p>${rep.chapters.bab5}</p>
                    </div>
                </div>
            `;
        }

        function logout() {
            db.currentUser = null;
            saveDB();
            showToast('success', 'Berhasil keluar');
            render();
        }

        // Initial launch
        render();
    </script>
</body>
</html>
